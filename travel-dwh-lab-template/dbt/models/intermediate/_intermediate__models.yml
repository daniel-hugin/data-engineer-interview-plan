version: 2

models:
  - name: int_exchange_rates__daily
    description: Un tipo de cambio por día natural y divisa, con forward fill de días sin publicación.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["rate_date", "quote_currency"]
    columns:
      - name: is_filled
        description: true si el tipo se ha arrastrado del último día hábil.
