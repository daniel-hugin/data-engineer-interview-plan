version: 2

models:
  - name: stg_hotel_bookings__bookings
    description: Reservas tipadas y limpias. Una fila por reserva.
    columns:
      - name: booking_id
        data_tests:
          - unique
          - not_null
      - name: hotel_type
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["city", "resort"]
      - name: arrival_date
        data_tests:
          - not_null
      - name: booking_date
        description: Fecha de reserva = fecha de llegada - lead time.
        data_tests:
          - not_null
      - name: adr_eur
        description: >
          Tarifa media diaria en EUR. El dataset tiene algún valor negativo y algún
          outlier extremo: el test avisa pero no bloquea.
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
                max_value: 1000
              config:
                severity: warn
